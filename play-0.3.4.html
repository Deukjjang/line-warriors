<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#163e34"><title>라인워리어즈</title>
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="라인워리어즈">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mobile.css">
</head><body>
<main id="app">
<header><div class="brand">라인워리어즈 <small>시대의 전쟁</small></div><div class="header-actions"><span id="coin-label" class="coins"></span><button id="settings" class="icon-button" aria-label="설정" title="설정"></button></div></header>
<section id="lobby"><nav id="lobby-nav" aria-label="메인 메뉴"></nav><div id="asset-status" role="status" style="padding:8px 16px;font-size:12px;background:#e5efdf">이미지 준비 중...</div><div id="lobby-content"></div></section>
<section id="battle-screen" hidden>
<div class="battle-status"><div class="base-status"><span>아군 요새 <b id="ally-hp"></b></span><progress id="ally-bar" max="1"></progress></div><div class="stage-status"><strong id="stage-label"></strong><span id="clock">00:00</span></div><div class="base-status enemy"><span>적군 요새 <b id="enemy-hp"></b></span><progress id="enemy-bar" max="1"></progress></div></div>
<section id="field" aria-label="전장"><div id="loading">전장 준비 중...</div><div id="battle-notice" role="status"></div><div class="era-tag"><span id="era-label"></span><span id="army-count"></span></div><div class="battle-tools"><div class="segmented" aria-label="진행 속도"><button id="speed-1" aria-pressed="true">1배</button><button id="speed-2" aria-pressed="false">2배</button></div><button id="pause" class="icon-button" aria-label="일시정지" title="일시정지"></button></div></section>
<section class="command-deck"><div class="resources"><div><span>식량</span><strong id="food"></strong><small id="income"></small></div><div><span>전리품</span><strong id="trophy"></strong></div></div><div id="units" class="unit-grid"></div><div id="skills" class="skill-grid"></div><div id="items" class="item-grid"></div></section>
</section>
<dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status"></div>
</main><script src="vendor/phaser.min.js"></script><script src="vendor/lucide.min.js"></script><script type="module" src="releases/0.3.4/app.js"></script>
</body></html>
